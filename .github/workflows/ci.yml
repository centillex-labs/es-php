name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: metadata consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check-consistency.py
      - name: Version mapping
        run: python3 scripts/es-release.py --list

  tarballs:
    needs: checks
    uses: ./.github/workflows/build-tarballs.yml
