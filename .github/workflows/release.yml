name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish under (e.g. v8.1.34-lts1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      branches: ${{ steps.resolve.outputs.branches }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          # Fails loudly if the tag does not correspond to a release in the lock.
          branches="$(python3 scripts/es-release.py --resolve-tag "$tag")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branches=$branches" >> "$GITHUB_OUTPUT"
          echo "tag=$tag -> branches=$branches"

  tarballs:
    needs: resolve
    uses: ./.github/workflows/build-tarballs.yml
    with:
      branches: ${{ needs.resolve.outputs.branches }}

  publish:
    name: publish
    needs: [resolve, tarballs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tarballs-*
          merge-multiple: true
          path: dist

      - name: Verify checksums and assemble SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          for f in php-*.tar.gz; do sha256sum -c "$f.sha256"; done
          sha256sum php-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Build release notes
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "Source releases for \`${TAG}\`."
            echo
            echo "Each tarball is the pristine upstream release with the ordered"
            echo "patch series applied and \`PHP_EXTRA_VERSION\` set to \`-ltsN\`."
            echo "Provenance for every release is inside the archive as"
            echo "\`LTS-RELEASE.json\`; the applied patches ship in \`lts-patches/\`."
            echo
            echo "| tarball | sha256 |"
            echo "| --- | --- |"
            ( cd dist && for f in php-*.tar.gz; do
                printf '| %s | `%s` |\n' "$f" "$(cut -d' ' -f1 < "$f.sha256")"
              done )
            echo
            echo "Support scope and limitations: see \`SECURITY.md\` at this tag."
          } > NOTES.md
          cat NOTES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          assets=(dist/php-*.tar.gz dist/php-*.tar.gz.sha256 dist/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${assets[@]}"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file NOTES.md \
              "${assets[@]}"
          fi
